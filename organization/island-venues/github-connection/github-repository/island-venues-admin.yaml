apiVersion: lowops.manifests.v1
kind: GithubRepository
metadata:
  name: island-venues-admin
  github-connection: default
  organization: island-venues
spec:
  description: "Island Venues staff app (React + Vite), behind Identity-Aware Proxy"
  public: true
  strategy: TRUNK_BASED
  configuration:
    wiki: false
    projects: false
    issues: true
    downloads: false
  codeOwners:
    - path: "*"
      owners:
        - venue-admins
  permissions:
    administrators:
      groups:
        - venue-admins
      members: []
    contributors:
      groups:
        - developers
      members: []
    viewers:
      groups: []
      members: []
