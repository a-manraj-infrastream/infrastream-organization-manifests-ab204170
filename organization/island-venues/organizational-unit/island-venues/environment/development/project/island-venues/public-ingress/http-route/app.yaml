apiVersion: lowops.manifests.v1
kind: HttpRoute
metadata:
  name: app
  project: island-venues
  environment: development
  organizational-unit: island-venues
  organization: island-venues
  public-ingress: portal
spec:
  description: Customer app and its API, on one origin
  # Most specific prefixes first; "/" is the catch-all and stays last. The
  # engine also orders rules by match specificity.
  rules:
    # Open on purpose: browsing venues needs no account.
    - matches:
        - prefixMatch: /api/catalog/
      action:
        destinations:
          - deploymentConfig: island-venues-api
            port: 8080
    # Signed-in. The full-path match is needed because the api serves
    # POST and GET on /api/bookings itself, which the prefix alone does not
    # cover; without it those calls would fall through to the web app.
    - matches:
        - fullPathMatch: /api/bookings
        - prefixMatch: /api/bookings/
      authentication:
        - type: INTERNAL
      action:
        destinations:
          - deploymentConfig: island-venues-api
            port: 8080
    # Open on purpose: the payment provider cannot sign in. The api rejects
    # any call whose X-Signature is not a valid HMAC of the body.
    - matches:
        - prefixMatch: /webhooks/
      action:
        destinations:
          - deploymentConfig: island-venues-api
            port: 8080
    # Open on purpose: the public single-page app. It holds no data; the
    # signed-in API calls above are protected on their own.
    - matches:
        - prefixMatch: /
      action:
        destinations:
          - deploymentConfig: island-venues-web
            port: 8080
