apiVersion: lowops.manifests.v1
kind: DeploymentConfig
metadata:
  name: island-venues-notifier
  project: island-venues
  environment: production
  organizational-unit: island-venues
  organization: island-venues
spec:
  description: Booking confirmation sender, receives booking-created via Eventarc
  # SENDGRID_API_KEY is injected from the Application's accessControl.secrets.
  # SENDER_EMAIL is deliberately not set yet: it must be a sender verified in
  # SendGrid. Without it the notifier logs the confirmation instead of sending.
  container:
    env:
      - name: SERVICE_NAME
        value: island-venues-notifier
      - name: LOG_LEVEL
        value: info
      # Only Eventarc pushes are accepted: the notifier verifies the Google OIDC
      # token on every POST and requires it to belong to this account. The engine
      # runs the Eventarc trigger as the application's own service account,
      # app-<sha256("island-venues-notifier")[:12]> in the island-venues-15e2 project
      # (project_executor.go, GetShortDeterministicPhysicalName(appName, "app", 30)).
      # Without it the notifier refuses to start (fail closed).
      - name: PUSH_SERVICE_ACCOUNT
        value: app-23ff2ba10851@island-venues-15e2.iam.gserviceaccount.com
      # PUSH_AUDIENCE is deliberately unset. Eventarc uses the Cloud Run service
      # URL as the token audience, and that URL exists only after the first
      # apply; unset, the notifier accepts "https://" + the request host. Set it
      # to the service URL afterwards to pin it.
  ports:
    8080: http
  # Cloud Run gates traffic on this startup probe. The Go services answer
  # GET /healthz with 200 once the HTTP server is listening.
  health:
    startup:
      protocol: http
      port: 8080
      path: /healthz
      checkIntervalSec: 5
      timeoutSec: 5
      healthyThreshold: 1
      unhealthyThreshold: 30
  # Push deliveries wake the service, so it can scale to zero in every
  # environment; a cold start only delays an email by a second or two.
  scaling:
    min: 0
  # The release tag CI cut on the first merge to main. The image carries the same
  # tag (docker metadata type=semver,pattern={{raw}}), so this is the image version.
  version: v0.1.1
